<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Rundown — Live Calendar</title>
<!--
  The Rundown — live branded calendar widget.

  This page is meant to be loaded inside an <iframe> on the published web
  version of a newsletter issue (see templates/newsletter.html /
  generate_newsletter.py for how the iframe src is built). It is NOT
  pasted into beehiiv directly, so — unlike templates/newsletter.html —
  normal <style> and <script> tags work completely normally here. See the
  "beehiiv-style-stripping" project memory for why that distinction
  matters: beehiiv strips <style>/<script> from HTML pasted into its
  editor, but a page loaded via <iframe> is just an ordinary webpage.

  This page is deliberately built to visually MIRROR the <noscript>-
  wrapped static This Week/Next Week cards in templates/newsletter.html
  exactly — same headings, same date-range subtitle text, same day-of-
  week headers, same card styling/order (see build_event_card() /
  build_this_week_block() / build_next_week_block() in
  generate_newsletter.py, which this file's CSS/markup values are copied
  from by hand; if those change, this needs updating to match). The only
  intended difference is that this page is live: it re-fetches
  events.json on every view instead of being frozen at send time.

  Data flow:
    scripts/generate_public_feed.py writes site/events.json, which this
    page fetches client-side on every page view, so it's always as
    current as the last time that script ran (see the Makefile "update"
    target for how that gets deployed).

  URL params (all set by apply_live_calendar_block() in
  generate_newsletter.py; this_week_label/next_week_label are the exact
  same pre-formatted "This Week Date Range"/"Next Week Date Range"
  strings the static email cards use — passed through as-is rather than
  reformatted here, so the subtitle text can't drift out of sync):
    ?this_week_start=YYYY-MM-DD   &this_week_end=YYYY-MM-DD
    ?next_week_start=YYYY-MM-DD   &next_week_end=YYYY-MM-DD
    &this_week_label=<url-encoded display string, e.g. "September 6-September 12">
    &next_week_label=<url-encoded display string>
  Without these params, both sections render empty (matching the
  email's "No events in this section yet." fallback).
-->
<style>
  :root {
    --purple: #4f2683;
    --ink: #18111f;
    --heading-ink: #2d2438;
    --body-text: #3f354c;
    --meta-text: #5b5166;
    --card-bg: #fbf9ff;
    --card-border: #e7dff0;
    --page-bg: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--page-bg);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: var(--ink);
  }

  body {
    padding: 0 10px;
  }

  /* Section heading + date-range subtitle — copied from the
     .section-title / date-range <p> styles in templates/newsletter.html */
  .section-title {
    margin: 0 0 4px;
    font-size: 22px;
    line-height: 28px;
    color: var(--heading-ink);
    font-weight: 800;
  }

  .section-title:not(:first-child) {
    margin-top: 32px;
  }

  .date-range {
    margin: 0 0 18px;
    font-size: 13px;
    line-height: 19px;
    color: var(--meta-text);
    font-weight: bold;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--card-border);
  }

  /* Day-of-week header — copied from build_this_week_block() /
     build_next_week_block() in generate_newsletter.py */
  .day-heading {
    margin: 10px 0 8px;
    padding: 0 0 8px 10px;
    border-left: 3px solid var(--purple);
    font-size: 13px;
    font-weight: 800;
    color: var(--purple);
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  .day-heading.first-in-section {
    margin-top: 0;
  }

  /* Event card — copied from build_event_card() in generate_newsletter.py.
     Image full-width on top (never side-by-side), matching the static
     email cards exactly rather than this page's own separate layout. */
  .event-card {
    display: block;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 14px;
    text-decoration: none;
    color: inherit;
  }

  .event-card img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 6px;
    border: 0;
    margin-bottom: 10px;
  }

  .event-card h3 {
    margin: 0 0 5px;
    font-size: 17px;
    line-height: 23px;
    color: var(--ink);
  }

  .event-card .meta {
    margin: 0;
    font-size: 13px;
    line-height: 20px;
    color: var(--body-text);
  }

  .event-card .desc {
    margin: 4px 0 0;
    font-size: 13px;
    line-height: 20px;
    color: var(--body-text);
  }

  /* "No events in this section yet." — copied from generate_newsletter.py's
     empty_msg fallback */
  .empty-section {
    font-size: 14px;
    color: var(--meta-text);
    padding: 8px 0;
  }

  .error-state, .loading-state {
    padding: 32px 12px;
    text-align: center;
    color: var(--meta-text);
    font-size: 14px;
  }

  .feed-footer {
    margin-top: 16px;
    text-align: center;
    font-size: 11px;
    color: var(--meta-text);
  }
</style>
</head>
<body>
  <div id="content" class="loading-state">Loading events…</div>
  <div id="footer" class="feed-footer" style="display:none;"></div>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);

  var thisWeekStart = params.get('this_week_start');
  var thisWeekEnd   = params.get('this_week_end');
  var nextWeekStart = params.get('next_week_start');
  var nextWeekEnd   = params.get('next_week_end');
  var thisWeekLabel = params.get('this_week_label') || '';
  var nextWeekLabel = params.get('next_week_label') || '';

  var contentEl = document.getElementById('content');
  var footerEl  = document.getElementById('footer');

  function esc(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function inRange(dateStr, start, end) {
    if (!dateStr) return false;
    if (start && dateStr < start) return false;
    if (end && dateStr > end) return false;
    return true;
  }

  // "TUESDAY" — matches build_this_week_block()'s dt.strftime("%A").upper()
  function dayNameOnly(dateStr) {
    var parts = dateStr.split('-').map(Number);
    var d = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
    return d.toLocaleDateString('en-US', { weekday: 'long', timeZone: 'UTC' }).toUpperCase();
  }

  // "FRIDAY, SEPTEMBER 11" — matches build_next_week_block()'s
  // (dt.strftime("%A, %B") + " " + str(dt.day)).upper()
  function dayNameWithDate(dateStr) {
    var parts = dateStr.split('-').map(Number);
    var d = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
    var weekday = d.toLocaleDateString('en-US', { weekday: 'long', timeZone: 'UTC' });
    var month   = d.toLocaleDateString('en-US', { month: 'long', timeZone: 'UTC' });
    return (weekday + ', ' + month + ' ' + parts[2]).toUpperCase();
  }

  // Renders one section's events, grouped by day, day headers via
  // dayHeadingFn — mirrors build_this_week_block()/build_next_week_block().
  // Returns an HTML string; caller wraps it with the section heading.
  function renderEventGroup(events, dayHeadingFn) {
    if (events.length === 0) {
      return '<p class="empty-section">No events in this section yet.</p>';
    }

    var html = '';
    var prevDay = null;
    var firstHeading = true;

    events.forEach(function (e) {
      if (e.date && e.date !== prevDay) {
        html += '<div class="day-heading' + (firstHeading ? ' first-in-section' : '') + '">'
          + esc(dayHeadingFn(e.date)) + '</div>';
        prevDay = e.date;
        firstHeading = false;
      }

      // venue | price only — no date (the day header covers it) and no
      // time, matching build_event_card()'s meta line exactly.
      var metaParts = [e.venue, e.price].filter(Boolean);
      var metaLine = metaParts.join(' | ');

      var imgHtml = e.image_url
        ? '<img src="' + esc(e.image_url) + '" alt="' + esc(e.name) + '" loading="lazy">'
        : '';

      var tag = e.link ? 'a' : 'div';
      var attrs = e.link ? ' href="' + esc(e.link) + '" target="_blank" rel="noopener"' : '';

      html += '<' + tag + ' class="event-card"' + attrs + '>'
        + imgHtml
        + '<h3>' + esc(e.name) + '</h3>'
        + (metaLine ? '<p class="meta">' + esc(metaLine) + '</p>' : '')
        + (e.description ? '<p class="desc">' + esc(e.description) + '</p>' : '')
        + '</' + tag + '>';
    });

    return html;
  }

  function render(allEvents) {
    var thisWeekEvents = allEvents
      .filter(function (e) { return inRange(e.date, thisWeekStart, thisWeekEnd); })
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });

    var nextWeekEvents = allEvents
      .filter(function (e) { return inRange(e.date, nextWeekStart, nextWeekEnd); })
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });

    var html = '';

    html += '<h2 class="section-title">📅 This Week</h2>';
    html += '<p class="date-range">' + esc(thisWeekLabel) + '</p>';
    html += renderEventGroup(thisWeekEvents, dayNameOnly);

    html += '<h2 class="section-title">📅 Next Week</h2>';
    html += '<p class="date-range">' + esc(nextWeekLabel) + '</p>';
    html += renderEventGroup(nextWeekEvents, dayNameWithDate);

    contentEl.className = '';
    contentEl.innerHTML = html;
  }

  fetch('../events.json', { cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (data) {
      render(data.events || []);

      if (data.generated_at) {
        footerEl.style.display = 'block';
        footerEl.textContent = 'Updated ' + new Date(data.generated_at).toLocaleString('en-US', {
          month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
        });
      }
    })
    .catch(function (err) {
      contentEl.className = 'error-state';
      contentEl.textContent = 'Couldn’t load events right now. Please try refreshing.';
      console.error('The Rundown calendar feed error:', err);
    });
})();
</script>
</body>
</html>
